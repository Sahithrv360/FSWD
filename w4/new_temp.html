<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast Dashboard</title>
    <!-- Bootstrap -->
    <link href="C:\Users\sahit\OneDrive\Desktop\coding\FSWD\bootstrap-5.3.8-dist\css\bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body id="weatherBody">

    <!-- Header -->
    <header class="text-center py-4">
        <h1>
            <img src="images/weather_logo.png"
                 alt="Weather"
                 width="50">
            Weather Forecast
        </h1>

        <p>
            Check weather conditions & forecast
        </p>
    </header>


    <!-- Search -->
    <div class="container mt-4">

        <form id="weatherForm">

            <div class="input-group mx-auto"
                 style="max-width: 500px;">

                <input type="text"
                       id="cityInput"
                       class="form-control"
                       placeholder="Search by city name">

                <button type="submit"
                        class="btn btn-primary">
                    Get Weather
                </button>

            </div>

        </form>

    </div>


    <!-- Error -->
    <div id="error"
         class="alert alert-danger text-center d-none mt-4">

        City not found. Please enter a valid city.

    </div>


    <!-- Current Weather -->
    <section id="weather" class="container my-4 d-none">

    <div class="current-weather card shadow text-center p-4 mx-auto"
         style="max-width: 500px;">

        <h2 id="location" class="fw-bold mb-3"></h2>

        <img id="weather-icon"
             src=""
             alt="Weather"
             width="100"
             class="mx-auto mb-3">

        <div class="display-3 fw-bold">
            <span id="temperature"></span>°C
        </div>

        <p id="description" class="fs-4 mt-3 mb-0"></p>

    </div>

</section>


    <!-- Metrics -->
    <section id="metrics"
             class="container my-4 d-none">

        <h2 class="text-center mb-4">
            Weather Metrics
        </h2>

        <div id="metrics-container"
             class="row g-3">
        </div>

    </section>


    <!-- 5 Day Forecast -->
    <section id="forecast"
             class="container my-5 d-none">

        <h2 class="text-center mb-4">
            5-Day Forecast
        </h2>

        <div id="forecast-container"
             class="row g-3">
        </div>

    </section>


    <!-- Footer -->
    <footer class="text-center py-4 mt-5">

        <p>
            Weather Forecast Dashboard
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Weather Forecast</title>
        <link rel="stylesheet" href="style.css">
        <link href="C:\Users\sahit\OneDrive\Desktop\coding\FSWD\bootstrap-5.3.8-dist\css\bootstrap.min.css" rel="stylesheet">
    </head>
    
    <body>
        <header class="text-center py-4">
            <h1 id="title">⛅ Weather Forecast</h1>
            <p>15-Day Forecast</p>
        </header>

        <div class = "container mt-4" id = "Search">
            <form action="submit">
                <div class="input-group mx-auto" style="max-width: 500px;">
                <input type="text" id="cityInput" placeholder="Enter city name..." class="form-control">
                <button type="submit" class="btn btn-primary">get forecast</button>
                </div>
            </form>
        </div>

        <div id="error" class="alert alert-danger text-center d-none mt-4">
            City not found. Please enter a valid city.
        </div>

        <div class="container mt-4 d-none" id="currWeather">
            <div class="card mx-auto text-center" style="max-width: 500px;">
                <div class="card-body">
                    <h3 id="cityName"></h3>
                    <h2 id="temp"></h2>
                    <p id="condition"></p>
                    <div class="row">
                        <div class="col">💧 <span id="humidity"></span><br>Humidity</div>
                        <div class="col">💨 <span id="wind">12 km/h</span><br>Wind</div>
                        <div class="col">🌧️ <span id="rain">5%</span><br>Rain</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mt-4 d-none" id="table">
            <h2 class="text-center mb-3">15-Day Forecast</h2>
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center" id="15dayforecast">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Weather</th>
                            <th>Min</th>
                            <th>Max</th>
                            <th>Rain</th>
                        </tr>
                    </thead>
                    <tbody id="forecastTable"></tbody>
                </table>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>

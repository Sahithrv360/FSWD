<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Menu">
        <h1>Cloud 9 Restaurant</h1>
        <h2>Menu</h2>
        <h5>STARTERS</h5>
        <hr>
        <div class="menu-section">
            <div class="items">
                <table width="100%">
                    <thead>
                        <tr>
                            <th class="item">Item</th>
                            <th class="price">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="item">Manchuria</td>
                            <td class="price">₹120</td>
                        </tr>
                        <tr>
                            <td class="item">Paneer Tikka</td>
                            <td class="price">₹180</td>
                        </tr>
                        <tr>
                            <td class="item">Chicken 65</td>
                            <td class="price">₹220</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="image">
                <img src="images/starters.jpg" alt="Starter Image">
            </div>
        </div>
        <h5>MAIN COURSE</h5>
        <hr>
        <div class="menu-section">
            <div class="items">
                <table width="100%">
                    <thead>
                        <tr>
                            <th class="item">Item</th>
                            <th class="price">Single</th>
                            <th class="price">Family</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="item">Chicken Biryani</td>
                            <td class="price">₹180</td>
                            <td class="price">₹600</td>
                        </tr>
                        <tr>
                            <td class="item">Paneer Biryani</td>
                            <td class="price">₹170</td>
                            <td class="price">₹580</td>
                        </tr>
                        <tr>
                            <td class="item">Jeera Rice</td>
                            <td class="price">₹160</td>
                            <td class="price">₹540</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="image">
                <img src="images/maincourse.jpg" alt="Main Course Image">
            </div>
        </div>
        <h5>DESSERTS</h5>
        <hr>
        <div class="menu-section">
            <div class="items">
                <table width="100%">
                    <thead>
                        <tr>
                            <th class="item">Item</th>
                            <th class="price">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="item">Gulab Jamun</td>
                            <td class="price">₹80</td>
                        </tr>
                        <tr>
                            <td class="item">Ice Cream</td>
                            <td class="price">₹100</td>
                        </tr>
                        <tr>
                            <td class="item">Apricot Delight</td>
                            <td class="price">₹220</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="image">
                <img src="images/dessert.jpg" alt="Dessert Image">
            </div>
        </div>
    </div>
</body>
</html>
